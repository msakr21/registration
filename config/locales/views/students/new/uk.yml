  interpreter_question: Чи потрібні вам послуги перекладача під час реєстрації?
  "yes": Так
  language_question: Якою мовою (мовами) ви розмовляєте?
  language: Будь ласка, введіть мову (мови)
  interpreting_note: Ми не можемо гарантувати усний переклад для кожної мови, але зробимо все можливе, щоб забезпечити його якомога більшою кількістю мов.
  level_question: На основі власної оцінки, який у вас рівень англійської?
  first_option: "Початківець – я майже або взагалі не знаю англійської. Мені потрібна допомога з розмовноюмовою, сприйняттям на слух, читанням та письмом."
  second_option: "Середній рівень – я можу ставити запитання та відповідати на них на побутові теми (наприклад, про роботу, покупки, здоров'я чи сім'ю). Я розумію прості розмови, можу давати короткі відповіді та писати базові речення."
  third_option: "Високий рівень – я добре розмовляю, розумію, читаю та пишу англійською. Я можу вести дискусії, читати новинні статті, а також писати електронні листи чи короткі есе майже або взагалі без помилок."
